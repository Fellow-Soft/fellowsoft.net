  viewBox="0 0 100 160"
  width="100"
  height="160"
  role="img"
  aria-labelledby="stub-title stub-description"
>
  <title id="stub-title">Canonical unnumbered ticket silhouette</title>
  <desc id="stub-description">
    A warm platinum portrait ticket with an arched crown, two true eye holes,
    a perforation, quiet serial print, an origin stamp, and two folded feet.
  </desc>
  <defs>
    <linearGradient id="stub-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddd5c3"/>
      <stop offset=".5" stop-color="#c9bfaa"/>
      <stop offset="1" stop-color="#b4aa97"/>
    </linearGradient>
    <linearGradient id="stub-foil" x1=".1" y1=".1" x2=".9" y2=".9">
      <stop offset="0" stop-color="#e8d9bd"/>
      <stop offset=".22" stop-color="#c6d8cf"/>
      <stop offset=".46" stop-color="#d7c2df"/>
      <stop offset=".7" stop-color="#e7d5b2"/>
      <stop offset="1" stop-color="#bdcfdb"/>
    </linearGradient>
    <mask id="stub-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="160">
      <rect width="100" height="160" fill="#fff"/>
      <circle cx="29" cy="29" r="4" fill="#000"/>
      <circle cx="71" cy="29" r="4" fill="#000"/>
    </mask>
    <clipPath id="stub-shape">
