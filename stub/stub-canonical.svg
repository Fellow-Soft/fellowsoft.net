        Q 1 8 12 6
        Q 50 -2 88 6
        Q 99 8 99 18
        L 99 148
        L 84 148
        L 84 160
        L 66 160
        L 66 148
        L 34 148
        L 34 160
        L 16 160
        L 16 148
        L 1 148
        Z
